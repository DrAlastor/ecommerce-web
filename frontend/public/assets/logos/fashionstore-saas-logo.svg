<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Minimalist Emblem: Monogram Geometric Box -->
  <g transform="translate(15, 20)">
    <!-- Thin Architectural Square -->
    <rect x="0" y="0" width="80" height="80" rx="14" stroke="#0F172A" stroke-width="3" fill="none" />
    <!-- Fine-line Inner Accent -->
    <path d="M 22 40 L 40 22 L 58 40 L 40 58 Z" stroke="#3B82F6" stroke-width="2.5" fill="none" />
    <circle cx="40" cy="40" r="3" fill="#0F172A" />
  </g>

  <!-- Typography: Pure, Minimalist, High-Fashion Tech -->
  <text x="120" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#0F172A" letter-spacing="7">
    FASHION STORE
  </text>
  
  <text x="122" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="7">
    SAAS PLATFORM &amp; COMMERCE
  </text>
</svg>

